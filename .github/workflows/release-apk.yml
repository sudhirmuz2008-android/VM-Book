name: Build VMM Book Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew clean :app:assembleRelease --stacktrace

      - name: Verify Release APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "Release APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VMM-Book-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
