name: Build Fresh Debug APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Clean and Build Debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated at $APK_PATH!"
            exit 1
          fi
          
          FILE_SIZE=$(wc -c < "$APK_PATH")
          echo "Generated APK size: $FILE_SIZE bytes"
          
          # Check if the APK file size is greater than 1 MB (1048576 bytes)
          if [ "$FILE_SIZE" -lt 1048576 ]; then
            echo "::error::Debug APK size is less than 1 MB!"
            exit 1
          fi
          
          echo "APK successfully verified."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fresh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
